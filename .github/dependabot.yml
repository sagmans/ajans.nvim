# Dependabot policy. The plugin ships plain Lua with no package manifest, so the
# only third-party code it pulls in is the pinned actions in .github/workflows.
version: 2
updates:
  # Every action is pinned by commit SHA, and nothing else raises those pins.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      # A week lets a compromised or retagged release be caught upstream before
      # its SHA lands here; GitHub Actions supports default-days only.
      default-days: 7
    groups:
      # One pull request per week keeps review on the action diffs, not on churn.
      actions:
        patterns: ["*"]
